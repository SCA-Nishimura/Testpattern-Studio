appId: jp.sc-a.testpattern-studio
productName: TestPattern Studio
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TestPattern Studio
portable:
  artifactName: TestPatternStudio-${version}-portable.exe
